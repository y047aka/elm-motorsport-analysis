name: Tests

# The checks that say the code is wrong: the Elm tests (elm-verify-examples +
# elm-test), the Flix CLI's tests, the circuit tools' tests, and `tsc` over the
# app's TypeScript. Kept apart from the VRT workflow because that one usually
# fails for a different reason — stale snapshots — and a red check should tell
# you which without being opened.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Coursier caches what Flix resolves under `flix/lib`, not under
      # ~/.cache/coursier. Uncached, every run asks Maven Central again, and
      # Central answers a busy runner with a 429.
      - uses: actions/cache@v6
        with:
          path: flix/lib
          key: flix-deps-${{ runner.os }}-${{ hashFiles('flix/flix.toml') }}
          restore-keys: flix-deps-${{ runner.os }}-
      # No `pnpm install`: none of these commands touches node_modules. The Elm
      # tests need only the elm toolchain the flake supplies, the CLI resolves
      # its own dependencies through flix -- and the timing report resolves nothing
      # at all, its project holding no Maven dependency -- and the circuit tools'
      # tests run on the Node the flake brings, their directory installing nothing.
      - name: Elm tests
        run: nix run .#test
      - name: CLI tests
        run: nix run .#flix-test
      # Its own step because its own project: the report's tests compile the
      # sources which `circuits/timing/src` symlinks out of `flix/src`, so a symlink
      # that does not survive the checkout fails here rather than at a report.
      - name: Timing report tests
        run: nix run .#geometry-timing-test
      - name: Circuit tool tests
        run: nix run .#geometry-test

  # Its own job because it is the one check here that needs node_modules, and
  # because a type error and a failing test should not share a red mark.
  typecheck:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm -C app install --frozen-lockfile
      - name: Type-check
        run: nix run .#typecheck
