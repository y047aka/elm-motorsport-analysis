name: Tests

# Kept apart from the VRT workflow because that one usually fails for a
# different reason — stale snapshots — and a red check should tell you which
# without being opened.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Coursier caches what a Flix project resolves under that project's own
      # `lib`, not under ~/.cache/coursier. Uncached, every run asks Maven
      # Central again, and Central answers a busy runner with a 429.
      - uses: actions/cache@v6
        with:
          path: |
            backend/lib
            circuits/lib
          key: flix-deps-${{ runner.os }}-${{ hashFiles('backend/flix.toml', 'circuits/flix.toml') }}
          restore-keys: flix-deps-${{ runner.os }}-
      # No `pnpm install`: none of these commands touches node_modules.
      - name: Elm tests
        run: nix run .#test
      - name: CLI tests
        run: nix run .#flix-test
      - name: Geometry command tests
        run: nix run .#geometry-test
      # The byte fence, over the two circuits a checkout keeps. A fresh asking
      # of OpenStreetMap is the regeneration fence's.
      - name: Geometry survey reproduces the kept geometries
        run: nix run .#geometry -- survey cota && nix run .#geometry -- survey le_mans

  # Its own job: the one check here that needs node_modules, and a type error
  # should not share a red mark with a failing test.
  typecheck:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm -C app install --frozen-lockfile
      - name: Type-check
        run: nix run .#typecheck
