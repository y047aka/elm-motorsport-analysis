name: Tests

# The checks that say the code is wrong: the Elm tests (elm-verify-examples +
# elm-test), the Flix CLI's tests, the circuit tools' tests, and `tsc` over the
# app's TypeScript. Kept apart from the VRT workflow because that one usually
# fails for a different reason — stale snapshots — and a red check should tell
# you which without being opened.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Coursier caches what Flix resolves under `flix/lib`, not under
      # ~/.cache/coursier. Uncached, every run asks Maven Central again, and
      # Central answers a busy runner with a 429.
      - uses: actions/cache@v6
        with:
          path: flix/lib
          key: flix-deps-${{ runner.os }}-${{ hashFiles('flix/flix.toml') }}
          restore-keys: flix-deps-${{ runner.os }}-
      # No `pnpm install`: none of these commands touches node_modules. The Elm
      # tests need only the elm toolchain the flake supplies, the Flix projects
      # resolve what they resolve through flix, and the circuit tools' tests run
      # on the Node the flake brings — their directory installs nothing.
      - name: Elm tests
        run: nix run .#test
      - name: CLI tests
        run: nix run .#flix-test
      # Its own project, so its own build: this is also the step that compiles the
      # sources `circuits/timing/src` symlinks out of `flix/src`.
      - name: Timing report tests
        run: nix run .#geometry-timing-test
      # The probe's own project, and the only one of the three that reaches a
      # network — which is what these tests are written to keep it out of.
      - name: Probe tests
        run: nix run .#geometry-probe-test
      # The geometry project's own tests: a kept geometry file read, two lines laid
      # together, an Overpass answer read, a lap chained and the bytes a geometry is
      # written in. Every reading is handed a fixture, so nothing here can change a kept
      # file.
      - name: Geometry command tests
        run: nix run .#geometry-diff-test
      # Does the survey over a kept answer still draw the bytes the app serves?
      # The regeneration fence asks the same of a fresh asking of OpenStreetMap;
      # this is the byte fence, over the two circuits a checkout keeps.
      - name: Geometry survey reproduces the kept geometries
        run: nix run .#geometry-survey -- cota && nix run .#geometry-survey -- le_mans

  # Its own job because it is the one check here that needs node_modules, and
  # because a type error and a failing test should not share a red mark.
  typecheck:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm -C app install --frozen-lockfile
      - name: Type-check
        run: nix run .#typecheck
