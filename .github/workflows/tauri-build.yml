name: Tauri Build (macOS)

# Builds the Tauri v2 native app (macOS) after ending web publishing (GitHub Pages).
# Manual (workflow_dispatch) only for now; tag-driven releases and other platforms
# are future work.
on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Flix resolves its Maven dependencies through Coursier, which caches
      # them inside the project rather than under ~/.cache/coursier. Without
      # this every run asks Maven Central for the JDBC driver again, and
      # Central answers a busy runner with a 429 that fails the job for a
      # reason that has nothing to do with the code.
      - uses: actions/cache@v6
        with:
          path: flix/lib
          key: flix-deps-${{ runner.os }}-${{ hashFiles('flix/flix.toml') }}
          restore-keys: flix-deps-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm -C app install --frozen-lockfile
      - name: Build Tauri app (macOS bundle)
        # beforeBuildCommand (pnpm run build) produces the Vite dist,
        # which is bundled as frontendDist into the .app / .dmg output.
        run: nix run .#tauri-build
      - uses: actions/upload-artifact@v7
        with:
          name: motorsport-analysis-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error
