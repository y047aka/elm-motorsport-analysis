name: Tauri Build (macOS)

# Builds the Tauri v2 native app (macOS), on manual dispatch.
on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Coursier caches what Flix resolves under `flix/lib`, not under
      # ~/.cache/coursier. Uncached, every run asks Maven Central again, and
      # Central answers a busy runner with a 429.
      - uses: actions/cache@v6
        with:
          path: flix/lib
          key: flix-deps-${{ runner.os }}-${{ hashFiles('flix/flix.toml') }}
          restore-keys: flix-deps-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm -C app install --frozen-lockfile
      - name: Build Tauri app (macOS bundle)
        # beforeBuildCommand (pnpm run build) produces the Vite dist,
        # which is bundled as frontendDist into the .app / .dmg output.
        run: nix run .#tauri-build
      - uses: actions/upload-artifact@v7
        with:
          name: motorsport-analysis-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error
