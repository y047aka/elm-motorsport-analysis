name: Tauri Build (macOS)

# Web 公開（GitHub Pages）を終了し、Tauri v2 のネイティブアプリ（macOS）を
# ビルドする。当面は手動実行（workflow_dispatch）のみ。タグ連動の自動リリースや
# 他プラットフォーム対応は今後の課題（docs/adr/0001 参照）。
on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Build Tauri app (macOS bundle)
        # beforeBuildCommand（pnpm run build）で elm-pages の dist を生成し、
        # それを frontendDist として同梱した .app / .dmg を出力する
        run: nix run .#tauri-build
      - uses: actions/upload-artifact@v7
        with:
          name: motorsport-analysis-macos
          path: |
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error
